name: Deploy Frontend

# Kick off the deployment phases in deploy-frontend.sh whenever code lands on main.
on:
  push:
    branches: [main]
    # Skip deploys for docs-only changes (optional — remove to deploy on every push).
    paths-ignore:
      - '**.md'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Only one deploy at a time; cancel an in-flight deploy if a newer commit arrives.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        run: bash deploy-frontend.sh --ci
        env:
          # Baked into the build (Vite reads VITE_*-prefixed vars at build time).
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # Consumed by Wrangler for non-interactive Cloudflare authentication.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
