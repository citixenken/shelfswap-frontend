<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ShelfSwap">
  <title>ShelfSwap</title>
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
  </defs>
  <!-- Brand squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#ssBg)" />
  <!-- Two-tone "S": top half white, bottom half emerald — mirrored halves = the swap -->
  <g fill="none" stroke-width="66" stroke-linecap="round">
    <path d="M 316.8 109.2 A 86 86 0 1 0 256 256" stroke="#ffffff" />
    <path d="M 256 256 A 86 86 0 1 1 195.2 402.8" stroke="#34d399" />
  </g>
</svg>
